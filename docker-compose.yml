version: '3.8'

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:dev
    container_name: lavalink
    restart: always
    ports:
      - "2333:2333"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    expose:
      - 2333
    

  bot:
    build: .
    container_name: discord-music-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./bot/src/storage:/app/bot/src/storage
      - ./logs:/app/logs
    depends_on:
      lavalink:
        condition: service_started